services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme_demo_password
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  server:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: 'false'
      REDIS_URL: redis://redis:6379
      MONGO_URI: mongodb://admin:changeme_demo_password@mongo:27017/chatapp?authSource=admin

volumes:
  redis-data:
  mongo-data:

